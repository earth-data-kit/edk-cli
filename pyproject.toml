[project]
name = "edk-cli"
version = "0.1.1"
description = "EDK CLI"
authors = [{ name = "Siddhant Gupta", email = "siddhantgupta3@gmail.com" }]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
  "click>=8.3.0,<9"
]

[project.scripts]
edk = "edk_cli.cli:edk"

[tool.setuptools]
include-package-data = true

[build-system]
requires = ["setuptools>=64", "wheel", "build"]
build-backend = "setuptools.build_meta"
